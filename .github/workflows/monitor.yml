name: Monitor Gift Cards Xbox Shopee

on:
  schedule:
    # Roda a cada 20 minutos. O GitHub pode atrasar um pouco em horários
    # de pico, isso é normal e não tem problema pro nosso caso.
    - cron: "*/20 * * * *"
  workflow_dispatch: {}   # permite rodar manualmente pelo site do GitHub

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Rodar o monitor
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python monitor.py

      - name: Salvar o estado (se algo mudou)
        run: |
          git config user.name "gift-card-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Atualiza estado das ofertas"
          git push
